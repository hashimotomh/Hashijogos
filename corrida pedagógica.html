<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrida Pedagógica</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-color: #1e1e24;
            --accent-color: #6366f1;
            --text-color: #f3f4f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #fff;
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.6);
            margin-bottom: 10px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-color);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #setup-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 400px;
        }

        label {
            font-weight: bold;
            color: #a5b4fc;
        }

        select, input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #4b5563;
            background: #374151;
            color: white;
            font-size: 1rem;
        }

        button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }

        #teams-config-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            width: 100%;
            margin-top: 15px;
        }

        .team-input-box {
            background: #2d2d35;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .emoji-selector-trigger {
            background: #374151;
            border: 1px dashed #6366f1;
            color: white;
            font-size: 1.8rem;
            padding: 5px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .emoji-selector-trigger:hover {
            background: #4b5563;
        }

        /* Modal de Seleção de Emojis */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #22222a;
            padding: 20px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #4b5563;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #374151;
            padding-bottom: 10px;
        }

        .category-title {
            font-size: 0.9rem;
            color: #a5b4fc;
            margin: 10px 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .emoji-option {
            font-size: 2rem;
            padding: 5px;
            background: #2d2d35;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s, background 0.2s;
        }

        .emoji-option:hover {
            background: #4f46e5;
            transform: scale(1.1);
        }

        /* Tela do Jogo */
        #game-screen {
            display: none;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #374151;
        }

        .track-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #151518;
            padding: 20px;
            border-radius: 10px;
        }

        .track {
            display: flex;
            align-items: center;
            background: #27272a;
            height: 70px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            border: 1px dashed #4b5563;
        }

        .track::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 10% 100%;
            pointer-events: none;
        }

        .finish-line {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 15px;
            background: repeating-linear-gradient(45deg, #fff, #fff 5px, #000 5px, #000 10px);
        }

        .team-runner {
            position: absolute;
            left: 0;
            width: 70px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            cursor: pointer;
            transition: left 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            user-select: none;
            z-index: 2;
        }

        .team-runner:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .team-name-label {
            position: absolute;
            left: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            color: rgba(255,255,255,0.35);
            pointer-events: none;
            z-index: 1;
        }

        .btn-decrease {
            position: absolute;
            right: 25px;
            background: #ef4444;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 3;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            border: none;
            cursor: pointer;
        }

        .btn-decrease:hover { background: #dc2626; }
        .audio-btn { background: #10b981; color: white; }
        .audio-btn:hover { background: #059669; }
        .reset-btn { background: #374151; color: white; }
        .reset-btn:hover { background: #4b5563; }
        .close-modal { background: #ef4444; color: white; padding: 5px 10px; font-size: 0.8rem;}
    </style>
</head>
<body>

    <h1>🏆 Corrida do Conhecimento 🏁</h1>
    
    <div class="container">
        <div id="setup-screen">
            <div class="form-group">
                <label for="team-count">Quantas equipes vão jogar? (2 a 10)</label>
                <select id="team-count" onchange="generateTeamInputs()">
                    <option value="2">2 Equipes</option>
                    <option value="3" selected>3 Equipes</option>
                    <option value="4">4 Equipes</option>
                    <option value="5">5 Equipes</option>
                    <option value="6">6 Equipes</option>
                    <option value="7">7 Equipes</option>
                    <option value="8">8 Equipes</option>
                    <option value="9">9 Equipes</option>
                    <option value="10">10 Equipes</option>
                </select>
            </div>

            <div id="teams-config-list"></div>

            <button class="btn-primary" onclick="startGame()" style="margin-top: 20px; width: 100%; max-width: 400px;">Iniciar Prova!</button>
        </div>

        <div id="game-screen">
            <div class="controls-bar">
                <button class="audio-btn" id="audio-toggle" onclick="toggleAudio()">🎵 Ligar Música</button>
                <button class="reset-btn" onclick="resetGame()">🔄 Resetar Jogo</button>
            </div>

            <div class="track-container" id="tracks-wrapper"></div>
        </div>
    </div>

    <div id="emoji-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Escolha um Emoji</h3>
                <button class="close-modal" onclick="closeEmojiModal()">Fechar</button>
            </div>
            <div id="emoji-options-container"></div>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="https://actions.google.com/sounds/v1/ambiences/ambient_hum_air_conditioner.ogg" type="audio/ogg">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    </audio>

    <script>
        const cleanEmojiCategories = {
            "Animais": ['🦁', '🦖', '🦊', '🦅', '🦈', '🦄', '🐯', '🦉', '🐝', '🐙', '🐸', '🦘'],
            "Tecnologia e Espaço": ['🚀', '🤖', '💻', '🛸', '🛰️', '🕹️', '⚙️', '🔋', '🔬', '🔭', '☄️', '🔮'],
            "Pessoas e Fantasia": ['🥷', '🧑‍🚀', '🧑‍🔬', '🕵️', '🧙', '🧑‍🍳', '🧑‍✈️', '👑', '🤠', '😎', '🔥', '👻'],
            "Competição e Símbolos": ['🏎️', '🏆', '🎯', '🎨', '🎲', '🧩', '💎', '💡', '⚡', '🌟', '🍀', '💥']
        };

        const defaultEmojis = ['🚀', '🦁', '🦖', '🤖', '🦊', '🦅', '🦄', '🥷', '🦈', '🏎️'];
        let teamsData = [];
        const maxSteps = 10; 
        let currentSelectingTeamIndex = null;

        window.onload = () => {
            generateTeamInputs();
            buildEmojiSelector();
        };

        function generateTeamInputs() {
            const count = parseInt(document.getElementById('team-count').value);
            const container = document.getElementById('teams-config-list');
            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const initialEmoji = defaultEmojis[i] || '⭐';
                container.innerHTML += `
                    <div class="team-input-box">
                        <label>Equipe ${i + 1}</label>
                        <input type="text" id="name-${i}" value="Time ${i + 1}" placeholder="Nome do Time">
                        <div class="emoji-selector-trigger" id="emoji-trigger-${i}" onclick="openEmojiModal(${i})">
                            ${initialEmoji}
                        </div>
                        <input type="hidden" id="emoji-val-${i}" value="${initialEmoji}">
                    </div>
                `;
            }
        }

        function buildEmojiSelector() {
            const container = document.getElementById('emoji-options-container');
            container.innerHTML = '';

            for (const [category, emojis] of Object.entries(cleanEmojiCategories)) {
                container.innerHTML += `<div class="category-title">${category}</div>`;
                let grid = `<div class="emoji-grid">`;
                emojis.forEach(emoji => {
                    grid += `<div class="emoji-option" onclick="selectEmoji('${emoji}')">${emoji}</div>`;
                });
                grid += `</div>`;
                container.innerHTML += grid;
            }
        }

        function openEmojiModal(index) {
            currentSelectingTeamIndex = index;
            document.getElementById('emoji-modal').style.display = 'flex';
        }

        function closeEmojiModal() {
            document.getElementById('emoji-modal').style.display = 'none';
        }

        function selectEmoji(emoji) {
            if (currentSelectingTeamIndex !== null) {
                document.getElementById(`emoji-trigger-${currentSelectingTeamIndex}`).innerText = emoji;
                document.getElementById(`emoji-val-${currentSelectingTeamIndex}`).value = emoji;
            }
            closeEmojiModal();
        }

        function startGame() {
            const count = parseInt(document.getElementById('team-count').value);
            teamsData = [];

            for (let i = 0; i < count; i++) {
                teamsData.push({
                    name: document.getElementById(`name-${i}`).value || `Time ${i+1}`,
                    emoji: document.getElementById(`emoji-val-${i}`).value || '⭐',
                    step: 0
                });
            }

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            
            renderTracks();
            document.getElementById('bg-music').volume = 0.3; 
        }

        function renderTracks() {
            const wrapper = document.getElementById('tracks-wrapper');
            wrapper.innerHTML = '';

            teamsData.forEach((team, index) => {
                const positionPercent = team.step * (85 / maxSteps);

                wrapper.innerHTML += `
                    <div class="track">
                        <div class="team-name-label">${team.name}</div>
                        <div class="team-runner" id="runner-${index}" style="left: ${positionPercent}%" onclick="advanceTeam(${index})">
                            ${team.emoji}
                        </div>
                        <button class="btn-decrease" onclick="recedeTeam(${index})">−</button>
                        <div class="finish-line"></div>
                    </div>
                `;
            });
        }

        function advanceTeam(index) {
            if (teamsData[index].step < maxSteps) {
                teamsData[index].step++;
                updatePosition(index);
                
                if (teamsData[index].step === maxSteps) {
                    setTimeout(() => {
                        alert(`🎉 Parabéns! O ${teamsData[index].name} (${teamsData[index].emoji}) venceu a rodada!`);
                    }, 400);
                }
            }
        }

        function recedeTeam(index) {
            if (teamsData[index].step > 0) {
                teamsData[index].step--;
                updatePosition(index);
            }
        }

        function updatePosition(index) {
            const runner = document.getElementById(`runner-${index}`);
            const positionPercent = teamsData[index].step * (85 / maxSteps);
            runner.style.left = `${positionPercent}%`;
        }

        function toggleAudio() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('audio-toggle');
            
            if (music.paused) {
                // Força o carregamento e dá o play
                music.load();
                music.play()
                    .then(() => {
                        btn.innerText = "🔇 Pausar Música";
                        btn.style.background = "#ef4444";
                    })
                    .catch(e => {
                        alert("Clique na tela primeiro antes de ligar o som! O navegador exige uma interação para liberar o áudio.");
                        console.log("Erro de áudio:", e);
                    });
            } else {
                music.pause();
                btn.innerText = "🎵 Ligar Música";
                btn.style.background = "#10b981";
            }
        }

        function resetGame() {
            const music = document.getElementById('bg-music');
            music.pause();
            music.currentTime = 0;
            document.getElementById('audio-toggle').innerText = "🎵 Ligar Música";
            document.getElementById('audio-toggle').style.background = "#10b981";

            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
