<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag ajustada para travar o zoom e forçar encaixe em TVs Android -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Passa para Lá - Arraste e Solte</title>
    <style>
        :root {
            --primary: #58cc02;
            --primary-dark: #46a302;
            --secondary: #1cb0f6;
            --secondary-dark: #1899d6;
            --error: #ea2b2b;
            --error-bg: #ffdfe0;
            --success-bg: #d7ffb8;
            --text-main: #3c3c3c;
            --text-muted: #888888;
            --bg-app: #ffffff;
            --bg-card: #f8f9fa;
            --border: #e5e5e5;
            --warning: #ff922b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Elimina qualquer rolagem global na TV */
            background-color: #f0f2f5;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            height: 100vh; /* Ocupa exatamente a altura visível */
            background: var(--bg-app);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        header {
            padding: 8px 15px;
            border-bottom: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        h1 {
            font-size: 18px;
            color: var(--secondary);
            font-weight: 700;
        }

        .system-controls {
            display: flex;
            gap: 6px;
        }

        .btn-sys {
            background: #f1f3f5;
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .btn-sys:hover { background: #e9ecef; }
        .btn-reset { background: #ffe3e3; color: var(--error); border-color: #ffa8a8; }
        .btn-finish { background: #e7f5ff; color: var(--secondary-dark); border-color: #a5d8ff; }
        .btn-switch { background: #e6fcf5; color: #0ca678; border-color: #96f2d7; }

        .mode-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 4px;
        }

        .btn-mode {
            flex: 1;
            padding: 6px;
            font-weight: 800;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        .btn-mode.active {
            border-color: var(--secondary);
            background: #e7f5ff;
            color: var(--secondary-dark);
        }

        .player-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 14px;
        }

        .timer-display {
            font-weight: 800;
            font-size: 14px;
            background: #fff3bf;
            color: #f59f00;
            padding: 4px 10px;
            border-radius: 16px;
            border: 1px solid #ffe066;
        }

        .timer-display.danger {
            background: #ffe3e3;
            color: var(--error);
            border-color: #ffa8a8;
            animation: blink 0.5s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }

        .progress-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .progress-bar-outer {
            flex-grow: 1;
            height: 12px;
            background: var(--border);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-inner {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 6px;
            transition: width 0.3s ease;
        }

        .stats {
            font-weight: 700;
            font-size: 12px;
            color: var(--text-main);
            min-width: 70px;
            text-align: right;
        }

        main {
            flex-grow: 1;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden; /* Mantém o foco sem transbordar */
        }

        /* Tela de Seleção */
        .setup-screen {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
            height: 100%;
        }

        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
            margin-top: 5px;
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .btn-student {
            background: white;
            border: 2px solid var(--border);
            padding: 8px 4px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: all 0.2s;
        }

        .btn-student:hover {
            border-color: var(--secondary);
            transform: translateY(-2px);
        }

        .btn-student.is-test {
            background: #d3f9d8;
            border-color: #40c057;
            color: #2b8a3e;
        }

        .btn-student .emoji { font-size: 20px; }
        .btn-student .name { font-weight: 700; font-size: 11px; text-transform: uppercase; }
        .btn-student .status { font-size: 10px; color: var(--text-muted); }

        /* Ranking */
        .ranking-screen {
            display: none;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 13px;
        }

        .ranking-item:nth-child(1) { border-color: #ffd43b; background: #fff9db; }
        .ranking-item:nth-child(2) { border-color: #ced4da; background: #f8f9fa; }
        .ranking-item:nth-child(3) { border-color: #d9480f; background: #ffe8cc; }

        .history-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            flex-grow: 1;
            overflow-y: auto;
            min-height: 100px;
        }

        .history-step {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
        }

        .step-num {
            font-size: 11px;
            background: var(--secondary);
            color: white;
            border-radius: 4px;
            padding: 2px 6px;
        }

        .math-display {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            padding: 0 4px;
        }
        .fraction .numerator {
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 1px;
        }
        .fraction .denominator {
            padding-top: 1px;
        }

        .controls-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 2px dashed var(--border);
            padding-top: 8px;
            flex-shrink: 0;
        }

        .instructions-hint {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            font-weight: 600;
        }

        /* Área de Arraste */
        .terms-editor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f3f5;
            padding: 10px 8px;
            border-radius: 12px;
            gap: 6px;
            min-height: 75px;
        }

        .side-box {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            flex: 1;
            justify-content: center;
            min-height: 55px;
            padding: 4px;
            border: 2px dashed #ced4da;
            border-radius: 10px;
            background: rgba(255,255,255,0.5);
            transition: all 0.2s;
        }

        .side-box.drag-over {
            background: #e7f5ff;
            border-color: var(--secondary);
            transform: scale(1.01);
        }

        /* Card Interativo */
        .term-card {
            background: white;
            border: 2px solid var(--secondary);
            border-radius: 8px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 0 var(--secondary-dark);
            cursor: grab;
            touch-action: none;
            transition: transform 0.1s, box-shadow 0.1s, border-color 0.2s;
            position: relative;
        }

        .term-card:active {
            cursor: grabbing;
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .term-val {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            pointer-events: none;
        }

        .equals-sign {
            font-size: 22px;
            font-weight: 800;
            color: var(--secondary);
            padding: 0 2px;
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-action {
            background: white;
            border: 2px solid var(--border);
            padding: 8px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 0 var(--border);
            transition: all 0.1s;
            text-align: center;
            font-size: 13px;
        }
        .btn-action:active { transform: translateY(2px); box-shadow: none; }
        .btn-action.primary { background: var(--secondary); color: white; border-color: var(--secondary-dark); box-shadow: 0 2px 0 var(--secondary-dark); }

        .divide-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            border: 2px solid var(--border);
            padding: 4px 8px;
            border-radius: 10px;
            font-weight: 700;
            justify-content: center;
            font-size: 13px;
        }

        select {
            padding: 4px 6px;
            font-weight: 700;
            font-size: 14px;
            border-radius: 6px;
            border: 2px solid var(--border);
        }

        footer {
            padding: 8px 15px;
            border-top: 2px solid var(--border);
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .feedback-message {
            display: none;
            font-size: 14px;
            font-weight: 700;
        }

        .footer-buttons {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .main-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--primary-dark);
            flex: 1;
        }

        footer.correct { background-color: var(--success-bg); border-top-color: #b8f28b; }
        footer.correct .feedback-message { display: block; color: #58a700; }
        footer.correct .main-btn { background: #58a700; box-shadow: 0 4px 0 #3e7500; }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="game-container">
    <header>
        <div class="header-top">
            <h1>Passa para Lá ✋</h1>
            <div class="system-controls">
                <button class="btn-sys btn-switch" id="header-switch-btn" onclick="backToSelect()" style="display:none;">👤 Trocar Aluno</button>
                <button class="btn-sys btn-finish" onclick="showRanking()">🏆 Ranking</button>
                <button class="btn-sys btn-reset" onclick="resetAll()">🔄 Resetar</button>
            </div>
        </div>
        
        <div class="player-bar" id="player-bar" style="display:none;">
            <div class="player-info">
                <span id="player-avatar"></span>
                <span id="player-name"></span>
            </div>
            <div class="timer-display" id="timer-display">⏱️ 00:00</div>
        </div>

        <div class="progress-wrapper" id="progress-wrapper" style="display:none;">
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progress-bar"></div>
            </div>
            <div class="stats" id="stats-display">Nível 1/50</div>
        </div>
    </header>

    <main>
        <!-- Tela de Seleção de Aluno e Modo -->
        <div class="setup-screen" id="setup-screen">
            <h2>Selecione o Modo e o Aluno</h2>
            
            <div class="mode-selector">
                <button class="btn-mode active" id="mode-normal-btn" onclick="setGameMode('normal')">📘 Modo Normal (50 Qs)</button>
                <button class="btn-mode" id="mode-attack-btn" onclick="setGameMode('attack')">⚡ Minute Attack (1 Min)</button>
            </div>

            <div class="students-grid" id="students-grid"></div>
        </div>

        <!-- Interface do Jogo -->
        <div id="game-screen" style="display:none; flex-direction:column; gap:8px; height:100%;">
            <div class="history-container" id="history-box"></div>

            <div class="controls-area" id="controls-panel">
                <div class="instructions-hint">
                    💡 <b>Arraste</b> para trocar de lado | ✌️ <b>Duplo clique/toque</b> para mudar o sinal (+/-)
                </div>

                <div class="terms-editor">
                    <div class="side-box" id="left-side" data-side="left"></div>
                    <div class="equals-sign">=</div>
                    <div class="side-box" id="right-side" data-side="right"></div>
                </div>

                <div class="action-row">
                    <button class="btn-action primary" onclick="reduceTerms()">Efetuar Operações</button>
                    <div class="divide-control">
                        <span>Dividir por:</span>
                        <select id="divisor-select">
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                        </select>
                        <button class="btn-mini" style="padding:4px 8px; background:var(--secondary); color:white; border-radius:6px; border:none; font-weight:700; cursor:pointer;" onclick="applyDivision()">ok</button>
                    </div>
                </div>
            </div>
        </div>
