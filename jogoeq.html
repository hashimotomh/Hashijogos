<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passa para Lá - Arraste e Solte</title>
    <style>
        :root {
            --primary: #58cc02;
            --primary-dark: #46a302;
            --secondary: #1cb0f6;
            --secondary-dark: #1899d6;
            --error: #ea2b2b;
            --error-bg: #ffdfe0;
            --success-bg: #d7ffb8;
            --text-main: #3c3c3c;
            --text-muted: #888888;
            --bg-app: #ffffff;
            --bg-card: #f8f9fa;
            --border: #e5e5e5;
            --warning: #ff922b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #f0f2f5;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 760px;
            background: var(--bg-app);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            position: relative;
        }

        header {
            padding: 15px 20px;
            border-bottom: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 20px;
            color: var(--secondary);
            font-weight: 700;
        }

        .system-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-sys {
            background: #f1f3f5;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-sys:hover { background: #e9ecef; }
        .btn-reset { background: #ffe3e3; color: var(--error); border-color: #ffa8a8; }
        .btn-finish { background: #e7f5ff; color: var(--secondary-dark); border-color: #a5d8ff; }
        .btn-switch { background: #e6fcf5; color: #0ca678; border-color: #96f2d7; }

        /* Seletor de Modo de Jogo */
        .mode-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }

        .btn-mode {
            flex: 1;
            padding: 10px;
            font-weight: 800;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-mode.active {
            border-color: var(--secondary);
            background: #e7f5ff;
            color: var(--secondary-dark);
        }

        .player-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 16px;
        }

        .timer-display {
            font-weight: 800;
            font-size: 16px;
            background: #fff3bf;
            color: #f59f00;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #ffe066;
        }

        .timer-display.danger {
            background: #ffe3e3;
            color: var(--error);
            border-color: #ffa8a8;
            animation: blink 0.5s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }

        .progress-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .progress-bar-outer {
            flex-grow: 1;
            height: 16px;
            background: var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .progress-bar-inner {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 8px;
            transition: width 0.3s ease;
        }

        .stats {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
            min-width: 80px;
            text-align: right;
        }

        main {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Tela de Seleção */
        .setup-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 10px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .btn-student {
            background: white;
            border: 2px solid var(--border);
            padding: 12px 8px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .btn-student:hover {
            border-color: var(--secondary);
            transform: translateY(-2px);
        }

        .btn-student.is-test {
            background: #d3f9d8;
            border-color: #40c057;
            color: #2b8a3e;
        }

        .btn-student .emoji { font-size: 24px; }
        .btn-student .name { font-weight: 700; font-size: 13px; text-transform: uppercase; }
        .btn-student .status { font-size: 11px; color: var(--text-muted); }

        /* Ranking */
        .ranking-screen {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-weight: 700;
        }

        .ranking-item:nth-child(1) { border-color: #ffd43b; background: #fff9db; }
        .ranking-item:nth-child(2) { border-color: #ced4da; background: #f8f9fa; }
        .ranking-item:nth-child(3) { border-color: #d9480f; background: #ffe8cc; }

        .history-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            min-height: 180px;
            max-height: 320px;
            overflow-y: auto;
        }

        .history-step {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-weight: 700;
            font-size: 20px;
        }

        .step-num {
            font-size: 13px;
            background: var(--secondary);
            color: white;
            border-radius: 6px;
            padding: 3px 8px;
        }

        .math-display {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            padding: 0 4px;
        }
        .fraction .numerator {
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 2px;
        }
        .fraction .denominator {
            padding-top: 2px;
        }

        .controls-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-top: 2px dashed var(--border);
            padding-top: 15px;
        }

        .instructions-hint {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            font-weight: 600;
        }

        /* Área de Arraste */
        .terms-editor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f3f5;
            padding: 20px 15px;
            border-radius: 16px;
            gap: 10px;
            min-height: 110px;
        }

        .side-box {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            flex: 1;
            justify-content: center;
            min-height: 70px;
            padding: 8px;
            border: 2px dashed #ced4da;
            border-radius: 12px;
            background: rgba(255,255,255,0.5);
            transition: all 0.2s;
        }

        .side-box.drag-over {
            background: #e7f5ff;
            border-color: var(--secondary);
            transform: scale(1.02);
        }

        /* Card Interativo */
        .term-card {
            background: white;
            border: 2px solid var(--secondary);
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 var(--secondary-dark);
            cursor: grab;
            touch-action: none;
            transition: transform 0.1s, box-shadow 0.1s, border-color 0.2s;
            position: relative;
        }

        .term-card:active {
            cursor: grabbing;
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .term-val {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            pointer-events: none;
        }

        .equals-sign {
            font-size: 28px;
            font-weight: 800;
            color: var(--secondary);
            padding: 0 5px;
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-action {
            background: white;
            border: 2px solid var(--border);
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--border);
            transition: all 0.1s;
            text-align: center;
        }
        .btn-action:active { transform: translateY(2px); box-shadow: none; }
        .btn-action.primary { background: var(--secondary); color: white; border-color: var(--secondary-dark); box-shadow: 0 3px 0 var(--secondary-dark); }

        .divide-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 2px solid var(--border);
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: 700;
            justify-content: center;
        }

        select {
            padding: 6px 10px;
            font-weight: 700;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid var(--border);
        }

        footer {
            padding: 15px 20px;
            border-top: 2px solid var(--border);
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 85px;
            gap: 10px;
        }

        .feedback-message {
            display: none;
            font-size: 16px;
            font-weight: 700;
        }

        .footer-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .main-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--primary-dark);
            flex: 1;
        }

        footer.correct { background-color: var(--success-bg); border-top-color: #b8f28b; }
        footer.correct .feedback-message { display: block; color: #58a700; }
        footer.correct .main-btn { background: #58a700; box-shadow: 0 5px 0 #3e7500; }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="game-container">
    <header>
        <div class="header-top">
            <h1>Passa para Lá ✋</h1>
            <div class="system-controls">
                <button class="btn-sys btn-switch" id="header-switch-btn" onclick="backToSelect()" style="display:none;">👤 Trocar Aluno</button>
                <button class="btn-sys btn-finish" onclick="showRanking()">🏆 Ranking / Finalizar</button>
                <button class="btn-sys btn-reset" onclick="resetAll()">🔄 Resetar Tudo</button>
            </div>
        </div>
        
        <div class="player-bar" id="player-bar" style="display:none;">
            <div class="player-info">
                <span id="player-avatar"></span>
                <span id="player-name"></span>
            </div>
            <div class="timer-display" id="timer-display">⏱️ 00:00</div>
        </div>

        <div class="progress-wrapper" id="progress-wrapper" style="display:none;">
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progress-bar"></div>
            </div>
            <div class="stats" id="stats-display">Nível 1/50</div>
        </div>
    </header>

    <main>
        <!-- Tela de Seleção de Aluno e Modo -->
        <div class="setup-screen" id="setup-screen">
            <h2>Selecione o Modo e o Aluno</h2>
            
            <div class="mode-selector">
                <button class="btn-mode active" id="mode-normal-btn" onclick="setGameMode('normal')">📘 Modo Normal (50 Qs)</button>
                <button class="btn-mode" id="mode-attack-btn" onclick="setGameMode('attack')">⚡ Minute Attack (1 Min)</button>
            </div>

            <div class="students-grid" id="students-grid"></div>
        </div>

        <!-- Interface do Jogo -->
        <div id="game-screen" style="display:none; flex-direction:column; gap:20px;">
            <div class="history-container" id="history-box"></div>

            <div class="controls-area" id="controls-panel">
                <div class="instructions-hint">
                    💡 <b>Arraste</b> o termo para trocar de lado (inverte o sinal).<br>
                    ✌️ <b>Toque duplo / Clique duplo</b> no termo para alterar o sinal (+/-).
                </div>

                <div class="terms-editor">
                    <div class="side-box" id="left-side" data-side="left"></div>
                    <div class="equals-sign">=</div>
                    <div class="side-box" id="right-side" data-side="right"></div>
                </div>

                <div class="action-row">
                    <button class="btn-action primary" onclick="reduceTerms()">Efetuar Operações (Somar/Subtrair)</button>
                    <div class="divide-control">
                        <span>Dividir por:</span>
                        <select id="divisor-select">
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                        </select>
                        <button class="btn-mini" style="padding:6px 10px; background:var(--secondary); color:white; border-radius:6px; border:none; font-weight:700; cursor:pointer;" onclick="applyDivision()">ok</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tela de Ranking Final -->
        <div class="ranking-screen" id="ranking-screen">
            <h2 id="ranking-title">🏆 Ranking do Desafio</h2>
            <div class="ranking-list" id="ranking-list"></div>
            <button class="btn-action primary" style="margin-top:15px;" onclick="backToSelect()">Voltar para Seleção</button>
        </div>
    </main>

    <footer id="feedback-footer" style="display:none;">
        <div class="feedback-message" id="feedback-text">Equação Resolvida com Sucesso! 🎉</div>
        <div class="footer-buttons">
            <button class="main-btn" id="action-btn" onclick="checkOrNext()">VERIFICAR SOLUÇÃO</button>
            <button class="main-btn" id="switch-after-btn" onclick="switchAfterSuccess()" style="display:none; background:#1cb0f6; box-shadow: 0 5px 0 #1899d6;">PRÓXIMO ALUNO 👤</button>
        </div>
    </footer>
</div>

<script>
    const EMOJIS = ['🐶', '🐱', '🦊', '🦁', '🐸', '🐵', '🦄', '🐼', '🐯', '🐨', '🐙', '🦖', '🤖', '🚀', '⭐', '🍎', '⚽', '🎨'];
    
    const OFFICIAL_STUDENTS = [
        "ALUNO TESTE",
        "1. ALYCE F.", "2. ANA CLARA", "3. ANA JÚLIA", "4. ANGEL R.",
        "5. ARTHUR E.", "6. BRUNO M.", "7. CLARA R.", "8. DAFNE L.", "9. DAVI LUCCA",
        "10. DAVI S.", "11. EVELLYN O.", "12. GIOVANA C.", "13. GUILHERME D.", "14. HEITOR D.",
        "15. ISAAC M.", "16. ISABELLY C.", "17. IZABELLE C.", "18. JASMINY K.", "19. JULIO V.",
        "20. KAUÃ A.", "21. LORENZO S.", "22. MARIA CLARA", "23. MIGUEL H.", "24. MURILO H.",
        "25. NICOLAS R.", "26. OLIVIA F.", "27. OTÁVIO B.", "28. PIETRA L.", "29. RYAN L.",
        "30. SOFIA C."
    ];

    let students = [];
    let activeStudent = null;
    let currentGameMode = 'normal'; // 'normal' ou 'attack'
    let attackScore = 0;
    let attackTimeLeft = 60;

    function initStudents() {
        let saved = localStorage.getItem('passa_para_la_v3');
        if(saved) {
            students = JSON.parse(saved);
        } else {
            students = OFFICIAL_STUDENTS.map((name, idx) => ({
                id: idx,
                name: name,
                isTest: idx === 0,
                emoji: idx === 0 ? '⚙️' : EMOJIS[Math.floor(Math.random() * EMOJIS.length)],
                completed: 0,
                totalTime: 0,
                attackRecord: 0
            }));
            saveStudents();
        }
    }

    function saveStudents() {
        localStorage.setItem('passa_para_la_v3', JSON.stringify(students));
    }

    // Cronômetro
    let timerInterval = null;
    let startTime = 0;
    let elapsedSeconds = 0;

    function startTimer() {
        stopTimer();
        const timerDisplay = document.getElementById('timer-display');
        timerDisplay.classList.remove('danger');

        if(currentGameMode === 'normal') {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                let currentSession = Math.floor((Date.now() - startTime) / 1000);
                let displayTime = elapsedSeconds + currentSession;
                timerDisplay.innerText = `⏱️ ${formatTime(displayTime)}`;
            }, 1000);
        } else {
            // Minute Attack Mode (60 segundos regressivos)
            attackTimeLeft = 60;
            timerDisplay.innerText = `⚡ 01:00`;
            timerInterval = setInterval(() => {
                attackTimeLeft--;
                if(attackTimeLeft <= 10) timerDisplay.classList.add('danger');
                
                let s = attackTimeLeft.toString().padStart(2, '0');
                timerDisplay.innerText = `⚡ 00:${s}`;

                if(attackTimeLeft <= 0) {
                    stopTimer();
                    finishMinuteAttack();
                }
            }, 1000);
        }
    }

    function stopTimer() {
        if(timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
            if(currentGameMode === 'normal' && startTime > 0) {
                elapsedSeconds += Math.floor((Date.now() - startTime) / 1000);
                startTime = 0;
            }
        }
    }

    function formatTime(sec) {
        let m = Math.floor(sec / 60).toString().padStart(2, '0');
        let s = (sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    // Gerador e Embaralhador de Equações Dinâmicas
    function generateEquations() {
        let eqList = [];
        while(eqList.length < 100) { // Gera bastantes equações aleatórias
            let x = Math.floor(Math.random() * 12) - 5;
            if(x === 0) x = 2;
            let a = Math.floor(Math.random() * 7) + 2;
            let c = Math.floor(Math.random() * 5) + 1;
            if(a === c) a += 2;
            let d = Math.floor(Math.random() * 15) - 7;
            let b = c * x + d - a * x;

            eqList.push({
                left: [{coef: a, var: 'x'}, {coef: b, var: ''}],
                right: [{coef: c, var: 'x'}, {coef: d, var: ''}],
                targetX: x
            });
        }
        
        // Algoritmo Fisher-Yates para garantir aleatoriedade real
        for (let i = eqList.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [eqList[i], eqList[j]] = [eqList[j], eqList[i]];
        }

        return eqList;
    }

    let challenges = generateEquations();
    let currentIdx = 0;
    let currentState = { left: [], right: [] };
    let historySteps = [];
    let isFinished = false;

    // Confetes
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confetes = [];

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerConfetti() {
        confetes = [];
        const colors = ['#58cc02', '#1cb0f6', '#ffc904', '#ff4b4b'];
        for (let i = 0; i < 90; i++) {
            confetes.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height,
                r: Math.random() * 6 + 4, cor: colors[Math.floor(Math.random() * colors.length)],
                tilt: Math.random() * 10 - 5, vy: Math.random() * 3 + 4
            });
        }
        animateConfetti();
    }

    function animateConfetti() {
        if (confetes.length === 0) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let anim = false;
        confetes.forEach((c) => {
            if (c.y < canvas.height) anim = true;
            c.y += c.vy;
            ctx.beginPath(); ctx.lineWidth = c.r; ctx.strokeStyle = c.cor;
            ctx.moveTo(c.x + c.tilt, c.y); ctx.lineTo(c.x, c.y + c.r); ctx.stroke();
        });
        if (anim) requestAnimationFrame(animateConfetti);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function playApplaud() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if(!AudioContext) return;
            const ctx = new AudioContext();
            for(let i=0; i<12; i++) {
                setTimeout(() => {
                    let buf = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate);
                    let data = buf.getChannelData(0);
                    for(let j=0; j<data.length; j++) data[j] = Math.random()*2 - 1;
                    let src = ctx.createBufferSource(); src.buffer = buf;
                    let gain = ctx.createGain(); gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    src.connect(gain); gain.connect(ctx.destination); src.start();
                }, i * 50);
            }
        } catch(e) {}
    }

    function setGameMode(mode) {
        currentGameMode = mode;
        document.getElementById('mode-normal-btn').className = `btn-mode ${mode === 'normal' ? 'active' : ''}`;
        document.getElementById('mode-attack-btn').className = `btn-mode ${mode === 'attack' ? 'active' : ''}`;
        renderSetupScreen();
    }

    function renderSetupScreen() {
        stopTimer();
        if(activeStudent && currentGameMode === 'normal') {
            activeStudent.totalTime = elapsedSeconds;
            saveStudents();
        }

        document.getElementById('setup-screen').style.display = 'flex';
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('ranking-screen').style.display = 'none';
        document.getElementById('player-bar').style.display = 'none';
        document.getElementById('progress-wrapper').style.display = 'none';
        document.getElementById('feedback-footer').style.display = 'none';
        document.getElementById('header-switch-btn').style.display = 'none';

        const grid = document.getElementById('students-grid');
        grid.innerHTML = students.map(s => {
            let statusText = currentGameMode === 'normal' 
                ? `${s.completed}/50 res. (${formatTime(s.totalTime)})`
                : `Recorde: ${s.attackRecord || 0} eq/min`;

            return `
                <button class="btn-student ${s.isTest ? 'is-test' : ''}" onclick="selectStudent(${s.id})">
                    <span class="emoji">${s.emoji}</span>
                    <span class="name">${s.name}</span>
                    <span class="status">${statusText}</span>
                </button>
            `;
        }).join('');
    }

    function selectStudent(id) {
        activeStudent = students.find(s => s.id === id);
        challenges = generateEquations(); // Gera nova sequência randomizada

        if(currentGameMode === 'normal') {
            currentIdx = activeStudent.completed;
            elapsedSeconds = activeStudent.totalTime;

            if(currentIdx >= 50) {
                alert(`${activeStudent.name} já completou todas as 50 equações!`);
                showRanking();
                return;
            }
        } else {
            // Minute Attack
            attackScore = 0;
            currentIdx = 0;
        }

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        document.getElementById('ranking-screen').style.display = 'none';
        document.getElementById('player-bar').style.display = 'flex';
        document.getElementById('progress-wrapper').style.display = 'flex';
        document.getElementById('feedback-footer').style.display = 'flex';
        document.getElementById('header-switch-btn').style.display = 'inline-block';

        document.getElementById('player-avatar').innerText = activeStudent.emoji;
        document.getElementById('player-name').innerText = activeStudent.name;

        loadLevel();
        startTimer();
    }

    function loadLevel() {
        isFinished = false;
        let c = challenges[currentIdx % challenges.length];
        currentState = JSON.parse(JSON.stringify({ left: c.left, right: c.right }));
        historySteps = [];
        
        if(currentGameMode === 'normal') {
            document.getElementById('progress-bar').style.width = ((currentIdx + 1) / 50 * 100) + '%';
            document.getElementById('stats-display').innerText = `Nível ${currentIdx + 1}/50`;
        } else {
            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('stats-display').innerText = `Acertos: ${attackScore}`;
        }
        
        document.getElementById('feedback-footer').className = "";
        document.getElementById('feedback-text').style.display = 'none';
        document.getElementById('switch-after-btn').style.display = 'none';
        
        const actionBtn = document.getElementById('action-btn');
        actionBtn.innerText = "VERIFICAR SOLUÇÃO";
        actionBtn.style.display = "block";
        
        document.getElementById('controls-panel').style.display = 'flex';

        addHistoryStep("Equação Inicial", renderMathHTML(currentState));
        renderEditor();
    }

    function formatTerm(term, isFirst) {
        let val = term.coef;
        let str = "";
        if(val > 0) str += isFirst ? "" : "+ ";
        else if(val < 0) str += isFirst ? "-" : "- ";
        
        let abs = Math.abs(val);
        if(term.var !== '') {
            str += (abs === 1 ? "" : abs) + term.var;
        } else {
            str += abs;
        }
        return str;
    }

    function renderMathHTML(state) {
        let leftStr = state.left.map((t, i) => formatTerm(t, i === 0)).join(' ') || "0";
        let rightStr = state.right.map((t, i) => formatTerm(t, i === 0)).join(' ') || "0";
        return `${leftStr} = ${rightStr}`;
    }

    function addHistoryStep(label, htmlContent) {
        historySteps.push({ label, html: htmlContent });
        renderHistory();
    }

    function renderHistory() {
        const box = document.getElementById('history-box');
        box.innerHTML = historySteps.map((step, idx) => `
            <div class="history-step">
                <span class="step-num">${idx + 1}º Passo</span>
                <div class="math-display">${step.html}</div>
            </div>
        `).join('');
        box.scrollTop = box.scrollHeight;
    }

    function renderEditor() {
        const leftEl = document.getElementById('left-side');
        const rightEl = document.getElementById('right-side');

        leftEl.innerHTML = currentState.left.map((t, i) => createTermCardHTML(t, 'left', i)).join('');
        rightEl.innerHTML = currentState.right.map((t, i) => createTermCardHTML(t, 'right', i)).join('');

        setupDragAndDropAndDoubleTap();
    }

    function createTermCardHTML(term, side, index) {
        let label = formatTerm(term, true);
        return `
            <div class="term-card" 
                 data-side="${side}" 
                 data-index="${index}" 
                 draggable="true">
                <span class="term-val">${label}</span>
            </div>
        `;
    }

    // Lógica Drag & Drop + Duplo Toque
    let draggedItemInfo = null;

    function setupDragAndDropAndDoubleTap() {
        const cards = document.querySelectorAll('.term-card');
        const boxes = document.querySelectorAll('.side-box');

        cards.forEach(card => {
            // Duplo clique (Desktop)
            card.addEventListener('dblclick', (e) => {
                if(isFinished) return;
                let side = card.getAttribute('data-side');
                let index = parseInt(card.getAttribute('data-index'));
                toggleSign(side, index);
            });

            // Duplo toque (Lousa / Mobile)
            let lastTapTime = 0;
            card.addEventListener('touchend', (e) => {
                if(isFinished) return;
                let currentTime = new Date().getTime();
                let tapLength = currentTime - lastTapTime;

                if (tapLength < 300 && tapLength > 0) {
                    e.preventDefault();
                    let side = card.getAttribute('data-side');
                    let index = parseInt(card.getAttribute('data-index'));
                    toggleSign(side, index);
                    lastTapTime = 0;
                } else {
                    lastTapTime = currentTime;
                }
            });

            // Arraste Mouse
            card.addEventListener('dragstart', (e) => {
                if(isFinished) return;
                draggedItemInfo = {
                    side: card.getAttribute('data-side'),
                    index: parseInt(card.getAttribute('data-index'))
                };
                e.dataTransfer.setData('text/plain', JSON.stringify(draggedItemInfo));
            });

            // Arraste Touch
            card.addEventListener('touchstart', (e) => {
                if(isFinished) return;
                draggedItemInfo = {
                    side: card.getAttribute('data-side'),
                    index: parseInt(card.getAttribute('data-index'))
                };
            }, {passive: true});

            card.addEventListener('touchend', (e) => {
                if(!draggedItemInfo || isFinished) return;
                let touch = e.changedTouches[0];
                let targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                if(targetEl) {
                    let box = targetEl.closest('.side-box');
                    if(box) {
                        let targetSide = box.getAttribute('data-side');
                        if(targetSide !== draggedItemInfo.side) {
                            moveTerm(draggedItemInfo.side, draggedItemInfo.index);
                        }
                    }
                }
                draggedItemInfo = null;
            });
        });

        boxes.forEach(box => {
            box.addEventListener('dragover', (e) => {
                e.preventDefault();
                box.classList.add('drag-over');
            });

            box.addEventListener('dragleave', () => {
                box.classList.remove('drag-over');
            });

            box.addEventListener('drop', (e) => {
                e.preventDefault();
                box.classList.remove('drag-over');
                if(!draggedItemInfo || isFinished) return;
                
                let targetSide = box.getAttribute('data-side');
                if(targetSide !== draggedItemInfo.side) {
                    moveTerm(draggedItemInfo.side, draggedItemInfo.index);
                }
                draggedItemInfo = null;
            });
        });
    }

    function moveTerm(fromSide, index) {
        if(isFinished) return;
        let targetSide = fromSide === 'left' ? 'right' : 'left';
        let term = currentState[fromSide].splice(index, 1)[0];
        term.coef = -term.coef;
        currentState[targetSide].push(term);
        
        addHistoryStep("Arrastou para o outro lado (Inverte Sinal)", renderMathHTML(currentState));
        renderEditor();
    }

    function toggleSign(side, index) {
        if(isFinished) return;
        currentState[side][index].coef = -currentState[side][index].coef;
        addHistoryStep("Duplo toque: Inverteu o Sinal (+/-)", renderMathHTML(currentState));
        renderEditor();
    }

    function reduceTerms() {
        if(isFinished) return;
        ['left', 'right'].forEach(side => {
            let xCoef = 0;
            let numCoef = 0;
            currentState[side].forEach(t => {
                if(t.var === 'x') xCoef += t.coef;
                else numCoef += t.coef;
            });
            let newSide = [];
            if(xCoef !== 0) newSide.push({coef: xCoef, var: 'x'});
            if(numCoef !== 0 || xCoef === 0) newSide.push({coef: numCoef, var: ''});
            currentState[side] = newSide;
        });

        addHistoryStep("Efetua Operações", renderMathHTML(currentState));
        renderEditor();
    }

    function applyDivision() {
        if(isFinished) return;
        let div = parseInt(document.getElementById('divisor-select').value);
        
        let leftHTML = currentState.left.map((t, i) => `<div class="fraction"><span class="numerator">${formatTerm(t, i===0)}</span><span class="denominator">${div}</span></div>`).join(' ');
        let rightHTML = currentState.right.map((t, i) => `<div class="fraction"><span class="numerator">${formatTerm(t, i===0)}</span><span class="denominator">${div}</span></div>`).join(' ');
        
        addHistoryStep(`Dividir por ${div}`, `${leftHTML} = ${rightHTML}`);

        ['left', 'right'].forEach(side => {
            currentState[side].forEach(t => {
                t.coef = t.coef / div;
            });
        });

        addHistoryStep("Resultado da Divisão", renderMathHTML(currentState));
        renderEditor();
    }

    function checkOrNext() {
        if(!isFinished) {
            let xVal = null;
            let target = challenges[currentIdx % challenges.length].targetX;

            if(currentState.left.length === 1 && currentState.left[0].var === 'x' && currentState.left[0].coef === 1 && currentState.right.length === 1 && currentState.right[0].var === '') {
                xVal = currentState.right[0].coef;
            } else if(currentState.right.length === 1 && currentState.right[0].var === 'x' && currentState.right[0].coef === 1 && currentState.left.length === 1 && currentState.left[0].var === '') {
                xVal = currentState.left[0].coef;
            }

            if(xVal === target) {
                isFinished = true;

                if(currentGameMode === 'normal') {
                    stopTimer();
                    activeStudent.completed += 1;
                    activeStudent.totalTime = elapsedSeconds;
                    saveStudents();

                    document.getElementById('feedback-footer').className = "correct";
                    document.getElementById('feedback-text').innerText = `Excelente! Solução Correta: x = ${target} 🎉`;
                    document.getElementById('feedback-text').style.display = 'block';
                    document.getElementById('action-btn').innerText = "PRÓXIMO DESAFIO DO MESMO ALUNO";
                    document.getElementById('switch-after-btn').style.display = 'block';
                } else {
                    // Minute Attack: vai para a próxima imediatamente
                    attackScore++;
                    if(attackScore > (activeStudent.attackRecord || 0)) {
                        activeStudent.attackRecord = attackScore;
                        saveStudents();
                    }
                    triggerConfetti();
                    currentIdx++;
                    loadLevel();
                    return;
                }
                
                triggerConfetti();
                playApplaud();
            } else {
                alert("A equação ainda não está totalmente resolvida isolando o 'x' corretamente!");
            }
        } else {
            currentIdx++;
            if(currentIdx >= 50 && currentGameMode === 'normal') {
                alert(`Parabéns ${activeStudent.name}! Você completou todas as 50 equações!`);
                showRanking();
            } else {
                loadLevel();
                startTimer();
            }
        }
    }

    function finishMinuteAttack() {
        alert(`⏰ TEMPO ESGOTADO! ${activeStudent.name} resolveu ${attackScore} equações em 1 minuto!`);
        
        if(attackScore > (activeStudent.attackRecord || 0)) {
            activeStudent.attackRecord = attackScore;
            saveStudents();
        }

        renderSetupScreen();
    }

    function switchAfterSuccess() {
        currentIdx++;
        renderSetupScreen();
    }

    function showRanking() {
        stopTimer();
        if(activeStudent && currentGameMode === 'normal') {
            activeStudent.totalTime = elapsedSeconds;
            saveStudents();
        }

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('ranking-screen').style.display = 'flex';
        document.getElementById('player-bar').style.display = 'none';
        document.getElementById('progress-wrapper').style.display = 'none';
        document.getElementById('feedback-footer').style.display = 'none';
        document.getElementById('header-switch-btn').style.display = 'none';

        document.getElementById('ranking-title').innerText = currentGameMode === 'normal' 
            ? '🏆 Ranking do Modo Normal (50 Equações)' 
            : '⚡ Ranking Minute Attack (Equações em 1 min)';

        let sorted = [...students].sort((a, b) => {
            if(currentGameMode === 'normal') {
                if (b.completed !== a.completed) return b.completed - a.completed;
                return a.totalTime - b.totalTime;
            } else {
                return (b.attackRecord || 0) - (a.attackRecord || 0);
            }
        });

        const list = document.getElementById('ranking-list');
        list.innerHTML = sorted.map((s, idx) => {
            let scoreText = currentGameMode === 'normal'
                ? `${s.completed} resolvidas (${formatTime(s.totalTime)})`
                : `${s.attackRecord || 0} equações/min`;

            return `
                <div class="ranking-item">
                    <span>#${idx + 1} ${s.emoji} ${s.name}</span>
                    <span>${scoreText}</span>
                </div>
            `;
        }).join('');
    }

    function backToSelect() {
        renderSetupScreen();
    }

    function resetAll() {
        if(confirm("Deseja resetar o progresso, tempos e recordes de TODOS os alunos?")) {
            localStorage.removeItem('passa_para_la_v3');
            initStudents();
            activeStudent = null;
            renderSetupScreen();
        }
    }

    window.onload = () => {
        initStudents();
        renderSetupScreen();
    };
</script>
</body>
