<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passa para Lá - Equações</title>
    <style>
        :root {
            --primary: #58cc02;
            --primary-dark: #46a302;
            --secondary: #1cb0f6;
            --secondary-dark: #1899d6;
            --error: #ea2b2b;
            --text-main: #3c3c3c;
            --text-muted: #777777;
            --bg-app: #ffffff;
            --bg-card: #f8f9fa;
            --border: #e5e5e5;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #f0f2f5;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-app);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
            position: relative;
        }

        header {
            padding: 15px 20px;
            border-bottom: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fff;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 22px;
            color: var(--secondary-dark);
            font-weight: 800;
        }

        .system-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-sys {
            background: #f1f3f5;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-sys:hover { background: #e9ecef; }
        .btn-reset { background: #ffe3e3; color: var(--error); border-color: #ffa8a8; }
        .btn-finish { background: #e7f5ff; color: var(--secondary-dark); border-color: #a5d8ff; }
        .btn-switch { background: #e6fcf5; color: #0ca678; border-color: #96f2d7; }

        .mode-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }

        .btn-mode {
            flex: 1;
            padding: 12px;
            font-weight: 800;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-mode.active {
            border-color: var(--secondary);
            background: #e7f5ff;
            color: var(--secondary-dark);
        }

        .player-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 16px;
        }

        .timer-display {
            font-weight: 800;
            font-size: 16px;
            background: #fff3bf;
            color: #f59f00;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #ffe066;
        }

        .timer-display.danger {
            background: #ffe3e3;
            color: var(--error);
            border-color: #ffa8a8;
        }

        .progress-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .progress-bar-outer {
            flex-grow: 1;
            height: 16px;
            background: var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .progress-bar-inner {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 8px;
            transition: width 0.3s ease;
        }

        .stats {
            font-weight: 700;
            font-size: 14px;
            min-width: 90px;
            text-align: right;
        }

        main {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        /* TELA DE SELEÇÃO DE ALUNOS */
        .setup-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 10px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .btn-student {
            background: white;
            border: 2px solid var(--border);
            padding: 12px 8px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: transform 0.1s;
        }

        .btn-student:hover {
            border-color: var(--secondary);
            transform: translateY(-2px);
        }

        .btn-student.is-test {
            background: #d3f9d8;
            border-color: #40c057;
            color: #2b8a3e;
        }

        .btn-student .emoji { font-size: 24px; }
        .btn-student .name { font-weight: 700; font-size: 13px; text-transform: uppercase; }
        .btn-student .status { font-size: 11px; color: var(--text-muted); }

        /* LAYOUT EM 2 COLUNAS DO JOGO */
        .two-columns-layout {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 20px;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 768px) {
            .two-columns-layout {
                grid-template-columns: 1fr;
            }
        }

        .column-panel {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--secondary-dark);
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* COLUNA 1: MANIPULAÇÃO */
        .instructions-hint {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
            background: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px dashed var(--border);
        }

        .terms-editor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 15px 10px;
            border-radius: 12px;
            gap: 6px;
            border: 2px solid var(--border);
            min-height: 120px;
        }

        .side-box {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            flex: 1;
            justify-content: center;
            min-height: 80px;
            padding: 8px;
            border: 2px dashed #ced4da;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .side-box.drag-over {
            background: #e7f5ff;
            border-color: var(--secondary);
        }

        .term-card {
            background: white;
            border: 2px solid var(--secondary);
            border-radius: 10px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 0 var(--secondary-dark);
            cursor: grab;
            touch-action: none;
        }

        .term-card:active {
            cursor: grabbing;
            transform: scale(1.05);
        }

        .term-val {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            pointer-events: none;
        }

        .equals-sign {
            font-size: 24px;
            font-weight: 800;
            color: var(--secondary);
        }

        .action-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-action {
            background: white;
            border: 2px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--border);
            text-align: center;
            font-size: 14px;
        }
        .btn-action:active { transform: translateY(2px); box-shadow: none; }
        .btn-action.primary { 
            background: var(--secondary); 
            color: white; 
            border-color: var(--secondary-dark); 
            box-shadow: 0 3px 0 var(--secondary-dark); 
        }

        .divide-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 2px solid var(--border);
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: 700;
            justify-content: space-between;
        }

        select {
            padding: 4px 8px;
            font-weight: 700;
            font-size: 15px;
            border-radius: 6px;
            border: 2px solid var(--border);
        }

        /* COLUNA 2: HISTÓRICO / RESUMO DO PASSO A PASSO */
        .history-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .history-step {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 10px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .step-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
        }

        .math-display {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            font-weight: 800;
            font-size: 18px;
            color: var(--text-main);
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            padding: 0 4px;
        }
        .fraction .numerator {
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 1px;
        }
        .fraction .denominator {
            padding-top: 1px;
        }

        /* TELA DE RANKING */
        .ranking-screen {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-weight: 700;
        }

        footer {
            padding: 15px 20px;
            border-top: 2px solid var(--border);
            background: white;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .feedback-message {
            display: none;
            font-size: 16px;
            font-weight: 800;
            color: #58a700;
        }

        .footer-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .main-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--primary-dark);
            flex: 1;
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="game-container">
    <header>
        <div class="header-top">
            <h1>Passa para Lá ✋</h1>
            <div class="system-controls">
                <button class="btn-sys btn-switch" id="header-switch-btn" onclick="backToSelect()" style="display:none;">👤 Mudar Aluno</button>
                <button class="btn-sys btn-finish" onclick="showRanking()">🏆 Ranking</button>
                <button class="btn-sys btn-reset" onclick="resetAll()">🔄 Reiniciar Tudo</button>
            </div>
        </div>
        
        <div class="player-bar" id="player-bar" style="display:none;">
            <div class="player-info">
                <span id="player-avatar"></span>
                <span id="player-name"></span>
            </div>
            <div class="timer-display" id="timer-display">⏱️ 00:00</div>
        </div>

        <div class="progress-wrapper" id="progress-wrapper" style="display:none;">
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progress-bar"></div>
            </div>
            <div class="stats" id="stats-display">Nível 1/50</div>
        </div>
    </header>

    <main>
        <!-- Tela de Seleção -->
        <div class="setup-screen" id="setup-screen">
            <h2>Selecione o Modo e o Aluno</h2>
            
            <div class="mode-selector">
                <button class="btn-mode active" id="mode-normal-btn" onclick="setGameMode('normal')">📘 Modo Normal (50 Qs)</button>
                <button class="btn-mode" id="mode-attack-btn" onclick="setGameMode('attack')">⚡ Minute Attack (1 Min)</button>
            </div>

            <div class="students-grid" id="students-grid"></div>
        </div>

        <!-- Tela do Jogo em 2 Colunas -->
        <div id="game-screen" style="display:none; width: 100%;">
            <div class="two-columns-layout">
                
                <!-- COLUNA 1: MANIPULAÇÃO -->
                <div class="column-panel">
                    <div class="panel-title">🛠️ Área de Manipulação</div>
                    
                    <div class="instructions-hint">
                        • <b>Arraste</b> o termo para o outro lado para inverter o sinal.<br>
                        • <b>Clique duplo</b> no termo para alterar o sinal (+/-).
                    </div>

                    <div class="terms-editor">
                        <div class="side-box" id="left-side" data-side="left"></div>
                        <div class="equals-sign">=</div>
                        <div class="side-box" id="right-side" data-side="right"></div>
                    </div>

                    <div class="action-column">
                        <button class="btn-action primary" onclick="reduceTerms()">⚡ Somar / Subtrair Termos</button>
                        
                        <div class="divide-control">
                            <span>Dividir ambos os lados por:</span>
                            <div style="display:flex; gap:6px;">
                                <select id="divisor-select">
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                </select>
                                <button class="btn-sys" style="background:var(--secondary); color:white;" onclick="applyDivision()">ok</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- COLUNA 2: HISTÓRICO DAS ETAPAS -->
                <div class="column-panel">
                    <div class="panel-title">📋 Lousa de Resolução</div>
                    <div class="history-container" id="history-box"></div>
                </div>

            </div>
        </div>

        <!-- Tela de Ranking -->
        <div class="ranking-screen" id="ranking-screen">
            <h2 id="ranking-title">🏆 Ranking do Desafio</h2>
            <div class="ranking-list" id="ranking-list"></div>
            <button class="btn-action primary" style="margin-top:15px;" onclick="backToSelect()">Voltar para Seleção</button>
        </div>
    </main>

    <footer id="feedback-footer" style="display:none;">
        <div class="feedback-message" id="feedback-text">Equação Resolvida! 🎉</div>
        <div class="footer-buttons">
            <button class="main-btn" id="action-btn" onclick="checkOrNext()">VERIFICAR SOLUÇÃO</button>
            <button class="main-btn" id="switch-after-btn" onclick="switchAfterSuccess()" style="display:none; background:#1cb0f6;">PRÓXIMO ALUNO 👤</button>
        </div>
    </footer>
</div>

<script>
    const EMOJIS = ['🐶', '🐱', '🦊', '🦁', '🐸', '🐵', '🦄', '🐼', '🐯', '🐨', '🐙', '🦖', '🤖', '🚀', '⭐', '🍎', '⚽', '🎨'];
    
    const OFFICIAL_STUDENTS = [
        "ALUNO TESTE",
        "1. ALYCE F.", "2. ANA CLARA", "3. ANA JÚLIA", "4. ANGEL R.",
        "5. ARTHUR E.", "6. BRUNO M.", "7. CLARA R.", "8. DAFNE L.", "9. DAVI LUCCA",
        "10. DAVI S.", "11. EVELLYN O.", "12. GIOVANA C.", "13. GUILHERME D.", "14. HEITOR D.",
        "15. ISAAC M.", "16. ISABELLY C.", "17. IZABELLE C.", "18. JASMINY K.", "19. JULIO V.",
        "20. KAUÃ A.", "21. LORENZO S.", "22. MARIA CLARA", "23. MIGUEL H.", "24. MURILO H.",
        "25. NICOLAS R.", "26. OLIVIA F.", "27. OTÁVIO B.", "28. PIETRA L.", "29. RYAN L.",
        "30. SOFIA C."
    ];

    let students = [];
    let activeStudent = null;
    let currentGameMode = 'normal';
    let attackScore = 0;
    let attackTimeLeft = 60;
    const STORAGE_KEY = 'passa_para_la_v5';

    function initStudents() {
        try {
            let saved = localStorage.getItem(STORAGE_KEY);
            if(saved) {
                students = JSON.parse(saved);
            } else {
                buildDefaultStudents();
            }
        } catch(e) {
            buildDefaultStudents();
        }
    }

    function buildDefaultStudents() {
        students = OFFICIAL_STUDENTS.map((name, idx) => ({
            id: idx,
            name: name,
            isTest: idx === 0,
            emoji: idx === 0 ? '⚙️' : EMOJIS[idx % EMOJIS.length],
            completed: 0,
            totalTime: 0,
            attackRecord: 0
        }));
        saveStudents();
    }

    function saveStudents() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
    }

    let timerInterval = null;
    let startTime = 0;
    let elapsedSeconds = 0;

    function startTimer() {
        stopTimer();
        const timerDisplay = document.getElementById('timer-display');
        if(timerDisplay) timerDisplay.classList.remove('danger');

        if(currentGameMode === 'normal') {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                let currentSession = Math.floor((Date.now() - startTime) / 1000);
                let displayTime = elapsedSeconds + currentSession;
                if(timerDisplay) timerDisplay.innerText = `⏱️ ${formatTime(displayTime)}`;
            }, 1000);
        } else {
            attackTimeLeft = 60;
            if(timerDisplay) timerDisplay.innerText = `⚡ 01:00`;
            timerInterval = setInterval(() => {
                attackTimeLeft--;
                if(attackTimeLeft <= 10 && timerDisplay) timerDisplay.classList.add('danger');
                let s = attackTimeLeft.toString().padStart(2, '0');
                if(timerDisplay) timerDisplay.innerText = `⚡ 00:${s}`;

                if(attackTimeLeft <= 0) {
                    stopTimer();
                    finishMinuteAttack();
                }
            }, 1000);
        }
    }

    function stopTimer() {
        if(timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
            if(currentGameMode === 'normal' && startTime > 0) {
                elapsedSeconds += Math.floor((Date.now() - startTime) / 1000);
                startTime = 0;
            }
        }
    }

    function formatTime(sec) {
        let m = Math.floor(sec / 60).toString().padStart(2, '0');
        let s = (sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function generateEquations() {
        let eqList = [];
        for(let i = 0; i < 60; i++) {
            let x = Math.floor(Math.random() * 10) - 4;
            if(x === 0) x = 3;
            let a = Math.floor(Math.random() * 5) + 2;
            let c = Math.floor(Math.random() * 3) + 1;
            if(a === c) a += 1;
            let d = Math.floor(Math.random() * 12) - 5;
            let b = c * x + d - a * x;

            eqList.push({
                left: [{coef: a, var: 'x'}, {coef: b, var: ''}],
                right: [{coef: c, var: 'x'}, {coef: d, var: ''}],
                targetX: x
            });
        }
        return eqList;
    }

    let challenges = [];
    let currentIdx = 0;
    let currentState = { left: [], right: [] };
    let historySteps = [];
    let isFinished = false;

    let canvas, ctx, confetes = [];

    function initCanvas() {
        canvas = document.getElementById('confetti-canvas');
        if(canvas) {
            ctx = canvas.getContext('2d');
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
        }
    }

    function resizeCanvas() { 
        if(canvas) {
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
    }

    function triggerConfetti() {
        if(!canvas || !ctx) return;
        confetes = [];
        const colors = ['#58cc02', '#1cb0f6', '#ffc904', '#ff4b4b'];
        for (let i = 0; i < 80; i++) {
            confetes.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height,
                r: Math.random() * 6 + 4, cor: colors[Math.floor(Math.random() * colors.length)],
                tilt: Math.random() * 10 - 5, vy: Math.random() * 3 + 4
            });
        }
        animateConfetti();
    }

    function animateConfetti() {
        if (!ctx || confetes.length === 0) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let anim = false;
        confetes.forEach((c) => {
            if (c.y < canvas.height) anim = true;
            c.y += c.vy;
            ctx.beginPath(); ctx.lineWidth = c.r; ctx.strokeStyle = c.cor;
            ctx.moveTo(c.x + c.tilt, c.y); ctx.lineTo(c.x, c.y + c.r); ctx.stroke();
        });
        if (anim) requestAnimationFrame(animateConfetti);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function setGameMode(mode) {
        currentGameMode = mode;
        document.getElementById('mode-normal-btn').className = `btn-mode ${mode === 'normal' ? 'active' : ''}`;
        document.getElementById('mode-attack-btn').className = `btn-mode ${mode === 'attack' ? 'active' : ''}`;
        renderSetupScreen();
    }

    function renderSetupScreen() {
        stopTimer();
        if(activeStudent && currentGameMode === 'normal') {
            activeStudent.totalTime = elapsedSeconds;
            saveStudents();
        }

        document.getElementById('setup-screen').style.display = 'flex';
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('ranking-screen').style.display = 'none';
        document.getElementById('player-bar').style.display = 'none';
        document.getElementById('progress-wrapper').style.display = 'none';
        document.getElementById('feedback-footer').style.display = 'none';
        document.getElementById('header-switch-btn').style.display = 'none';

        const grid = document.getElementById('students-grid');
        grid.innerHTML = students.map(s => {
            let statusText = currentGameMode === 'normal' 
                ? `${s.completed}/50 (${formatTime(s.totalTime)})`
                : `Recorde: ${s.attackRecord || 0} eq/min`;

            return `
                <button class="btn-student ${s.isTest ? 'is-test' : ''}" onclick="selectStudent(${s.id})">
                    <span class="emoji">${s.emoji}</span>
                    <span class="name">${s.name}</span>
                    <span class="status">${statusText}</span>
                </button>
            `;
        }).join('');
    }

    function selectStudent(id) {
        activeStudent = students.find(s => s.id === id);
        challenges = generateEquations();

        if(currentGameMode === 'normal') {
            currentIdx = activeStudent.completed;
            elapsedSeconds = activeStudent.totalTime;

            if(currentIdx >= 50) {
                alert(`${activeStudent.name} já completou todas as 50 equações!`);
                showRanking();
                return;
            }
        } else {
            attackScore = 0;
            currentIdx = 0;
        }

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('ranking-screen').style.display = 'none';
        document.getElementById('player-bar').style.display = 'flex';
        document.getElementById('progress-wrapper').style.display = 'flex';
        document.getElementById('feedback-footer').style.display = 'flex';
        document.getElementById('header-switch-btn').style.display = 'inline-block';

        document.getElementById('player-avatar').innerText = activeStudent.emoji;
        document.getElementById('player-name').innerText = activeStudent.name;

        loadLevel();
        startTimer();
    }

    function loadLevel() {
        isFinished = false;
        let c = challenges[currentIdx % challenges.length];
        currentState = JSON.parse(JSON.stringify({ left: c.left, right: c.right }));
        historySteps = [];
        
        if(currentGameMode === 'normal') {
            document.getElementById('progress-bar').style.width = ((currentIdx + 1) / 50 * 100) + '%';
            document.getElementById('stats-display').innerText = `Nível ${currentIdx + 1}/50`;
        } else {
            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('stats-display').innerText = `Acertos: ${attackScore}`;
        }
        
        document.getElementById('feedback-text').style.display = 'none';
        document.getElementById('switch-after-btn').style.display = 'none';
        
        const actionBtn = document.getElementById('action-btn');
        actionBtn.innerText = "VERIFICAR SOLUÇÃO";
        actionBtn.style.display = "block";

        addHistoryStep("Início da Equação", renderMathHTML(currentState));
        renderEditor();
    }

    function formatTerm(term, isFirst) {
        let val = term.coef;
        let str = "";
        if(val > 0) str += isFirst ? "" : "+ ";
        else if(val < 0) str += isFirst ? "-" : "- ";
        
        let abs = Math.abs(val);
        if(term.var !== '') {
            str += (abs === 1 ? "" : abs) + term.var;
        } else {
            str += abs;
        }
        return str;
    }

    function renderMathHTML(state) {
        let leftStr = state.left.map((t, i) => formatTerm(t, i === 0)).join(' ') || "0";
        let rightStr = state.right.map((t, i) => formatTerm(t, i === 0)).join(' ') || "0";
        return `${leftStr} = ${rightStr}`;
    }

    function addHistoryStep(label, htmlContent) {
        historySteps.push({ label, html: htmlContent });
        renderHistory();
    }

    function renderHistory() {
        const box = document.getElementById('history-box');
        box.innerHTML = historySteps.map((step, idx) => `
            <div class="history-step">
                <div class="step-header">
                    <span>${idx + 1}º Passo</span>
                    <span>${step.label}</span>
                </div>
                <div class="math-display">${step.html}</div>
            </div>
        `).join('');
        box.scrollTop = box.scrollHeight;
    }

    function renderEditor() {
        const leftEl = document.getElementById('left-side');
        const rightEl = document.getElementById('right-side');

        leftEl.innerHTML = currentState.left.map((t, i) => createTermCardHTML(t, 'left', i)).join('');
        rightEl.innerHTML = currentState.right.map((t, i) => createTermCardHTML(t, 'right', i)).join('');

        setupDragAndDropAndDoubleTap();
    }

    function createTermCardHTML(term, side, index) {
        let label = formatTerm(term, true);
        return `
            <div class="term-card" 
                 data-side="${side}" 
                 data-index="${index}" 
                 draggable="true">
                <span class="term-val">${label}</span>
            </div>
        `;
    }

    let draggedItemInfo = null;

    function setupDragAndDropAndDoubleTap() {
        const cards = document.querySelectorAll('.term-card');
        const boxes = document.querySelectorAll('.side-box');

        cards.forEach(card => {
            card.addEventListener('dblclick', () => {
                if(isFinished) return;
                let side = card.getAttribute('data-side');
                let index = parseInt(card.getAttribute('data-index'));
                toggleSign(side, index);
            });

            card.addEventListener('dragstart', () => {
                if(isFinished) return;
                draggedItemInfo = {
                    side: card.getAttribute('data-side'),
                    index: parseInt(card.getAttribute('data-index'))
                };
            });

            card.addEventListener('touchstart', () => {
                if(isFinished) return;
                draggedItemInfo = {
                    side: card.getAttribute('data-side'),
                    index: parseInt(card.getAttribute('data-index'))
                };
            }, {passive: true});

            card.addEventListener('touchend', (e) => {
                if(!draggedItemInfo || isFinished) return;
                let touch = e.changedTouches[0];
                let targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                if(targetEl) {
                    let box = targetEl.closest('.side-box');
                    if(box) {
                        let targetSide = box.getAttribute('data-side');
                        if(targetSide !== draggedItemInfo.side) {
                            moveTerm(draggedItemInfo.side, draggedItemInfo.index);
                        }
                    }
                }
                draggedItemInfo = null;
            });
        });

        boxes.forEach(box => {
            box.addEventListener('dragover', (e) => {
                e.preventDefault();
                box.classList.add('drag-over');
            });

            box.addEventListener('dragleave', () => box.classList.remove('drag-over'));

            box.addEventListener('drop', (e) => {
                e.preventDefault();
                box.classList.remove('drag-over');
                if(!draggedItemInfo || isFinished) return;
                
                let targetSide = box.getAttribute('data-side');
                if(targetSide !== draggedItemInfo.side) {
                    moveTerm(draggedItemInfo.side, draggedItemInfo.index);
                }
                draggedItemInfo = null;
            });
        });
    }

    function moveTerm(fromSide, index) {
        if(isFinished) return;
        let targetSide = fromSide === 'left' ? 'right' : 'left';
        let term = currentState[fromSide].splice(index, 1)[0];
        term.coef = -term.coef;
        currentState[targetSide].push(term);
        
        addHistoryStep("Passou para o outro lado", renderMathHTML(currentState));
        renderEditor();
    }

    function toggleSign(side, index) {
        if(isFinished) return;
        currentState[side][index].coef = -currentState[side][index].coef;
        addHistoryStep("Inverteu Sinal (+/-)", renderMathHTML(currentState));
        renderEditor();
    }

    function reduceTerms() {
        if(isFinished) return;
        ['left', 'right'].forEach(side => {
            let xCoef = 0;
            let numCoef = 0;
            currentState[side].forEach(t => {
                if(t.var === 'x') xCoef += t.coef;
                else numCoef += t.coef;
            });
            let newSide = [];
            if(xCoef !== 0) newSide.push({coef: xCoef, var: 'x'});
            if(numCoef !== 0 || xCoef === 0) newSide.push({coef: numCoef, var: ''});
            currentState[side] = newSide;
        });

        addHistoryStep("Efetua Operações", renderMathHTML(currentState));
        renderEditor();
    }

    function applyDivision() {
        if(isFinished) return;
        let div = parseInt(document.getElementById('divisor-select').value);
        
        let leftHTML = currentState.left.map((t, i) => `<div class="fraction"><span class="numerator">${formatTerm(t, i===0)}</span><span class="denominator">${div}</span></div>`).join(' ');
        let rightHTML = currentState.right.map((t, i) => `<div class="fraction"><span class="numerator">${formatTerm(t, i===0)}</span><span class="denominator">${div}</span></div>`).join(' ');
        
        addHistoryStep(`Dividir ambos os lados por ${div}`, `${leftHTML} = ${rightHTML}`);

        ['left', 'right'].forEach(side => {
            currentState[side].forEach(t => {
                t.coef = t.coef / div;
            });
        });

        addHistoryStep("Resultado da Divisão", renderMathHTML(currentState));
        renderEditor();
    }

    function checkOrNext() {
        if(!isFinished) {
            let xVal = null;
            let target = challenges[currentIdx % challenges.length].targetX;

            if(currentState.left.length === 1 && currentState.left[0].var === 'x' && currentState.left[0].coef === 1 && currentState.right.length === 1 && currentState.right[0].var === '') {
                xVal = currentState.right[0].coef;
            } else if(currentState.right.length === 1 && currentState.right[0].var === 'x' && currentState.right[0].coef === 1 && currentState.left.length === 1 && currentState.left[0].var === '') {
                xVal = currentState.left[0].coef;
            }

            if(xVal === target) {
                isFinished = true;

                if(currentGameMode === 'normal') {
                    stopTimer();
                    activeStudent.completed += 1;
                    activeStudent.totalTime = elapsedSeconds;
                    saveStudents();

                    document.getElementById('feedback-text').innerText = `Excelente! Solução Correta: x = ${target} 🎉`;
                    document.getElementById('feedback-text').style.display = 'block';
                    document.getElementById('action-btn').innerText = "PRÓXIMA EQUAÇÃO";
                    document.getElementById('switch-after-btn').style.display = 'block';
                } else {
                    attackScore++;
                    if(attackScore > (activeStudent.attackRecord || 0)) {
                        activeStudent.attackRecord = attackScore;
                        saveStudents();
                    }
                    triggerConfetti();
                    currentIdx++;
                    loadLevel();
                    return;
                }
                
                triggerConfetti();
            } else {
                alert("A equação ainda não está resolvida com x isolado!");
            }
        } else {
            currentIdx++;
            if(currentIdx >= 50 && currentGameMode === 'normal') {
                alert(`Parabéns ${activeStudent.name}! Você completou todas as 50 equações!`);
                showRanking();
            } else {
                loadLevel();
                startTimer();
            }
        }
    }

    function finishMinuteAttack() {
        alert(`⏰ TEMPO ESGOTADO! ${activeStudent.name} resolveu ${attackScore} equações!`);
        if(attackScore > (activeStudent.attackRecord || 0)) {
            activeStudent.attackRecord = attackScore;
            saveStudents();
        }
        renderSetupScreen();
    }

    function switchAfterSuccess() {
        currentIdx++;
        renderSetupScreen();
    }

    function showRanking() {
        stopTimer();
        if(activeStudent && currentGameMode === 'normal') {
            activeStudent.totalTime = elapsedSeconds;
            saveStudents();
        }

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('ranking-screen').style.display = 'flex';
        document.getElementById('player-bar').style.display = 'none';
        document.getElementById('progress-wrapper').style.display = 'none';
        document.getElementById('feedback-footer').style.display = 'none';
        document.getElementById('header-switch-btn').style.display = 'none';

        document.getElementById('ranking-title').innerText = currentGameMode === 'normal' 
            ? '🏆 Ranking Modo Normal' 
            : '⚡ Ranking Minute Attack';

        let sorted = [...students].sort((a, b) => {
            if(currentGameMode === 'normal') {
                if (b.completed !== a.completed) return b.completed - a.completed;
                return a.totalTime - b.totalTime;
            } else {
                return (b.attackRecord || 0) - (a.attackRecord || 0);
            }
        });

        const list = document.getElementById('ranking-list');
        list.innerHTML = sorted.map((s, idx) => {
            let scoreText = currentGameMode === 'normal'
                ? `${s.completed} resolvidas (${formatTime(s.totalTime)})`
                : `${s.attackRecord || 0} eq/min`;

            return `
                <div class="ranking-item">
                    <span>#${idx + 1} ${s.emoji} ${s.name}</span>
                    <span>${scoreText}</span>
                </div>
            `;
        }).join('');
    }

    function backToSelect() {
        renderSetupScreen();
    }

    function resetAll() {
        if(confirm("Tem certeza que deseja resetar TODOS os dados e nomes salvos?")) {
            localStorage.removeItem(STORAGE_KEY);
            buildDefaultStudents();
            activeStudent = null;
            renderSetupScreen();
        }
    }

    window.onload = () => {
        initCanvas();
        initStudents();
        renderSetupScreen();
    };
</script>
</body>
</html>
